let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
let cseed = 777; // cosmetic random (petals, sparkles): never touches gameplay
function crng() {
  cseed = (cseed + 0x6D2B79F5) | 0;
  let t = Math.imul(cseed ^ (cseed >>> 15), cseed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

const canvas = document.getElementById('game');

function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', weight = 'bold') {

  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}

  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 5); ctx.strokeStyle = outline;
  ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y);
}

  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function panel(x, y, w, h, fill = '#fffaf0', edge = '#7a5a3a', r = 18) {
  ctx.fillStyle = 'rgba(40,60,30,0.25)'; rr(x + 4, y + 6, w, h, r); ctx.fill();
  ctx.fillStyle = fill; rr(x, y, w, h, r); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = edge; rr(x, y, w, h, r); ctx.stroke();
}

  if (c !== 'rainbow') return c;

}
function fmt(n) {

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();

let touchMode = false;

// Pointers: a tap on a HUD button, the joystick, the action button, or a drag that turns the camera.
const pointers = new Map(); // id -> {role, x, y, sx, sy}
const joy = { active: false, id: -1, cx: 0, cy: 0, dx: 0, dy: 0 };
let taps = []; // logical points tapped this step, read by the HUD
let dragYaw = 0, wheelZoom = 0;
function toLogical(e) { return { x: e.clientX / SCALE, y: e.clientY / SCALE }; }
canvas.addEventListener('pointerdown', e => {
  startAudio();
  if (e.pointerType === 'touch') touchMode = true;
  const p = toLogical(e);
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  const b = buttonAt(p.x, p.y);
  if (b) { pointers.set(e.pointerId, { role: 'button', x: p.x, y: p.y }); taps.push({ b }); return; }
  if (touchMode && scene === 'play' && !state.menu && !state.reveal) {
    if (inActionButton(p.x, p.y)) { pointers.set(e.pointerId, { role: 'action' }); hit.add('Space'); return; }
    if (p.x < W * 0.45 && p.y > H * 0.35 && !joy.active) {
      joy.active = true; joy.id = e.pointerId; joy.cx = p.x; joy.cy = p.y; joy.dx = 0; joy.dy = 0;
      pointers.set(e.pointerId, { role: 'joy' }); return;
    }
  }
  pointers.set(e.pointerId, { role: 'drag', x: p.x, y: p.y, sx: p.x, sy: p.y });
});
canvas.addEventListener('pointermove', e => {
  const q = pointers.get(e.pointerId); if (!q) return;
  const p = toLogical(e);
  if (q.role === 'joy') { joy.dx = p.x - joy.cx; joy.dy = p.y - joy.cy; }
  else if (q.role === 'drag') { dragYaw += (p.x - q.x) * SCALE; q.x = p.x; q.y = p.y; }
});
function endPointer(e) {
  const q = pointers.get(e.pointerId);

}

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  try {
    if (!audio) {
      const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
      const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
      out.connect(ac.destination); audio = { ac, out };
    }
    if (audio.ac.state === 'suspended') audio.ac.resume();
  } catch (_) { /* no audio on this device */ }
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'triangle', vol = 0.25, delay = 0, slide = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur + 0.02);
}

// Rounded block geometry: a box whose corners are pushed onto a sphere of radius r.
const geoCache = new Map();
function rbox(w, h, d, r = 0.12) {
  const key = `${w}|${h}|${d}|${r}`;
  if (geoCache.has(key)) return geoCache.get(key);
  r = Math.min(r, w / 2, h / 2, d / 2) * 0.999;
  const g = new THREE.BoxGeometry(w, h, d, 3, 3, 3);
  const pos = g.attributes.position, v = new THREE.Vector3(), p = new THREE.Vector3();
  const ix = w / 2 - r, iy = h / 2 - r, iz = d / 2 - r;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    p.set(Math.max(-ix, Math.min(ix, v.x)), Math.max(-iy, Math.min(iy, v.y)), Math.max(-iz, Math.min(iz, v.z)));
    v.sub(p); if (v.lengthSq() > 0) v.setLength(r); v.add(p);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  geoCache.set(key, g); return g;
}
const matCache = new Map();
function mat(color, opts) {
  const key = color + (opts ? JSON.stringify(opts) : '');
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshLambertMaterial(Object.assign({ color, flatShading: true }, opts || {}));
  matCache.set(key, m); return m;
}
function glowMat(color, opacity = 0.6) {
  return new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
}
// part(parent, w,h,d, color, x,y,z, r): a rounded block placed in its parent
function part(parent, w, h, d, color, x = 0, y = 0, z = 0, r = 0.1) {
  const m = new THREE.Mesh(rbox(w, h, d, r), mat(color));
  m.position.set(x, y, z); parent.add(m); return m;
}
function cone(parent, rad, h, color, x, y, z, seg = 6) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(rad, h, seg), mat(color));
  m.position.set(x, y, z); parent.add(m); return m;
}
function cyl(parent, rt, rb, h, color, x, y, z, seg = 8) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat(color));
  m.position.set(x, y, z); parent.add(m); return m;
}
const shadowGeo = new THREE.CircleGeometry(1, 16).rotateX(-Math.PI / 2);
const shadowMat = new THREE.MeshBasicMaterial({ color: '#2d5a2a', transparent: true, opacity: 0.25, depthWrite: false });
function blob(parent, s, x = 0, z = 0) {

}

}

function makePlayer() {

  part(head, 0.14, 0.07, 0.04, '#ff8a8a', -0.26, -0.12, 0.36, 0.02); part(head, 0.14, 0.07, 0.04, '#ff8a8a', 0.26, -0.12, 0.36, 0.02);

function petalFlower(parent, color, x, y, z, s = 1, center = '#ffe066') {

  part(parent, 0.14 * s, 0.08 * s, 0.14 * s, center, x, y + 0.03 * s, z, 0.04);
}

// ---- Thumbnails: each icon is the 3D model, rendered once -----------------------------------
const thumbs = {};
(function makeThumbs() {
  let tr;
  try { tr = new THREE.WebGLRenderer({ alpha: true, antialias: !CHEAP, preserveDrawingBuffer: true }); }
  catch (_) { return; }
  const S = CHEAP ? 64 : 128; tr.setSize(S, S, false); tr.setPixelRatio(1);
  const sc = new THREE.Scene(); addLights(sc);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  const box = new THREE.Box3(), c = new THREE.Vector3(), s = new THREE.Vector3();
  function snap(key, model) {
    sc.add(model); box.setFromObject(model); box.getCenter(c); box.getSize(s);
    const r = Math.max(s.x, s.y, s.z) * 0.62 + 0.1, d = r / Math.tan(15 * Math.PI / 180);
    cam.position.set(c.x + d * 0.45, c.y + d * 0.35, c.z + d * 0.82); cam.lookAt(c);
    tr.render(sc, cam);
    const cv = document.createElement('canvas'); cv.width = S; cv.height = S; cv.getContext('2d').drawImage(tr.domElement, 0, 0);
    thumbs[key] = cv; sc.remove(model);
  }
  HELPERS.forEach(h => snap('h:' + h.id, makeHelper(h.id)));
  CROPS.forEach(cp => { snap('c:' + cp.id, makeProduce(cp.id)); snap('s:' + cp.id, makeSeedBag(cp.id)); });
  Object.keys(GOODS).forEach(k => snap('g:' + k, makeGood(k)));
  tr.dispose();
})();
function icon(key, x, y, size, dark = false) {
  const im = thumbs[key];
  if (!im) { ctx.fillStyle = '#ccc'; rr(x, y, size, size, 8); ctx.fill(); return; }
  if (!dark) { ctx.drawImage(im, x, y, size, size); return; }
  const t = document.createElement('canvas'); t.width = im.width; t.height = im.height;
  const tx = t.getContext('2d'); tx.drawImage(im, 0, 0); tx.globalCompositeOperation = 'source-in'; tx.fillStyle = '#56606e'; tx.fillRect(0, 0, t.width, t.height);
  ctx.drawImage(t, x, y, size, size);
}

// =========================================================================================
// The game's rules
// =========================================================================================
let scene, state;
function newState() {
  const s = {
    t: 0, score: 0, gained: '',
    coins: tune.start_coins, earned: 0,
    seeds: { carrot: tune.start_carrot_seeds, strawberry: 0, corn: 0, pumpkin: 0, watermelon: 0 },
    crops: { carrot: 0, strawberry: 0, corn: 0, pumpkin: 0, watermelon: 0 },
    goods: { egg: [0, 0], milk: [0, 0], wool: [0, 0], honey: [0, 0] }, // [count, value]
    helpers: {}, // id -> {star, pad}
    seen: {},    // id -> true once pulled
    rows: tune.field_start_rows, plots: [], pads: [],
    pulls: 0, harvests: 0, sel: 0,
    player: { x: -5.2, z: 0.4, rot: Math.PI }, yaw: 0, zoom: 0,
    menu: null, reveal: null, hints: {},
  };
  for (let i = 0; i < s.rows * PLOT_COLS; i++) s.plots.push({ crop: null, prog: 0, left: 0 });
  for (let i = 0; i < tune.pads_start; i++) s.pads.push({ h: null, timer: 0, goods: [] });
  return s;
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = newState();
}
const SAVE_KEY = 'spring-gacha-farm-v1';
function save() {
  if (CHECKED) return;
  try {
    const s = Object.assign({}, state, { menu: null, reveal: null });
    localStorage.setItem(SAVE_KEY, JSON.stringify({ s, seed }));
  } catch (_) { /* storage blocked: the farm just isn't kept */ }
}
function load() {
  if (CHECKED) return false;
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    const d = JSON.parse(raw); const fresh = newState();
    state = Object.assign(fresh, d.s, { menu: null, reveal: null });
    seed = d.seed || seed;
    return true;
  } catch (_) { return false; }
}
function hasSave() { if (CHECKED) return false; try { return !!localStorage.getItem(SAVE_KEY); } catch (_) { return false; } }

// helper power: 1 star = the config value, each star adds star_bonus, the 별빛 거북 boosts the rest
function starMult(id) { const h = state.helpers[id]; return 1 + tune.star_bonus * ((h ? h.star : 1) - 1); }
function placed(id) { const h = state.helpers[id]; return h && h.pad >= 0; }
function allBoost(id) { return id !== 'turtle' && placed('turtle') ? 1 + tune.turtle_value * starMult('turtle') : 1; }
function power(id) { return tune[id + '_value'] * starMult(id) * allBoost(id); }
function growRate(i) {
  const p = plotPos(i); let r = 1;
  for (const id of ['tulip', 'cherry']) if (placed(id)) {
    const pp = padPos(state.helpers[id].pad);
    if (Math.hypot(pp.x - p.x, pp.z - p.z) <= tune[id + '_radius']) r += power(id);
  }
  if (placed('unicorn')) r += power('unicorn');
  return r;
}
function doubleChance() {
  let c = placed('rabbit') ? power('rabbit') : 0;
  if (placed('unicorn')) c += tune.unicorn_double * starMult('unicorn') * allBoost('unicorn');
  return Math.min(0.95, c);
}
function cropPrice(id) { return Math.round(tune[id + '_sell'] * (placed('sunflower') ? 1 + power('sunflower') : 1)); }
function gachaCost() { return Math.round(tune.gacha_cost * Math.pow(tune.gacha_cost_growth, Math.min(state.pulls, tune.gacha_cost_cap))); }
function helperPrice(id) { const h = state.helpers[id]; return Math.round(tune.helper_sell_base * Math.pow(tune.helper_sell_growth, HELPER[id].tier) * (h ? h.star : 1)); }
function rowCost() { return Math.round(tune.field_row_cost * Math.pow(tune.field_row_growth, state.rows - tune.field_start_rows)); }
function padCost() { return Math.round(tune.pad_cost * Math.pow(tune.pad_growth, state.pads.length - tune.pads_start)); }
function abilityText(id, star) {
  const h = HELPER[id], s = 1 + tune.star_bonus * ((star || 1) - 1);
  const v = tune[id + '_value'] * s;
  switch (id) {
    case 'chicken': case 'cow': case 'sheep': case 'beehive':
      return `${tune[id + '_every']}초마다 ${GOODS[h.good]} (${fmt(v)}코인)`;
    case 'moneytree': case 'dragon': return `${tune[id + '_every']}초마다 코인 ${fmt(v)}`;
    case 'tulip': case 'cherry': return `주변 밭 성장 +${Math.round(v * 100)}%`;
    case 'rabbit': return `수확 2배 확률 ${Math.round(Math.min(0.95, v) * 100)}%`;
    case 'sunflower': return `작물 판매가 +${Math.round(v * 100)}%`;
    case 'unicorn': return `밭 전체 성장 +${Math.round(v * 100)}%, 2배 수확`;
    case 'turtle': return `다른 친구 능력 +${Math.round(v * 100)}%`;
  }
  return '';
}

// floating words and toasts
const floats = []; // {x,y,z,text,color,t}
const toasts = []; // {text,color,t}
function floatText(x, y, z, text, color = '#fff') { floats.push({ x, y, z, text, color, t: 0 }); }
function toast(text, color = '#fffaf0', hold = 2.6) {
  if (toasts.length && toasts[toasts.length - 1].text === text) { toasts[toasts.length - 1].t = 0; return; }
  toasts.push({ text, color, t: 0, hold }); if (toasts.length > 3) toasts.shift();
}
function addCoins(n, x, y, z) {
  state.coins += n; state.earned += n;
  if (x !== undefined) floatText(x, y, z, `+${fmt(n)}`, '#ffd23f');
}

// what's in the hand: seeds you own, then helpers in the bag
function hotbarItems() {
  const items = [];
  for (const c of CROPS) if (state.seeds[c.id] > 0) items.push({ type: 'seed', id: c.id });
  for (const h of HELPERS) { const o = state.helpers[h.id]; if (o && o.pad < 0) items.push({ type: 'helper', id: h.id }); }
  return items.slice(0, 8);
}
function selected() { const it = hotbarItems(); return it[Math.min(state.sel, it.length - 1)] || null; }

// What the player can act on: the nearest plot, pad, the shop or the machine in reach.
function targetNear() {
  const px = state.player.x, pz = state.player.z, R = tune.interact_range;
  let best = null, bd = R;
  const consider = (d, t) => { if (d < bd) { bd = d; best = t; } };
  state.plots.forEach((pl, i) => { const p = plotPos(i); consider(Math.hypot(p.x - px, p.z - pz) - 0.3, { kind: 'plot', i, x: p.x, z: p.z }); });
  state.pads.forEach((pd, i) => { const p = padPos(i); consider(Math.hypot(p.x - px, p.z - pz) - 0.3, { kind: 'pad', i, x: p.x, z: p.z }); });
  consider(Math.hypot(SHOP_SPOT.x - px, SHOP_SPOT.z - pz) - 0.6, { kind: 'shop', x: SHOP_SPOT.x, z: SHOP_SPOT.z });
  consider(Math.hypot(GACHA_SPOT.x - px, GACHA_SPOT.z - pz) - 0.6, { kind: 'gacha', x: GACHA_SPOT.x, z: GACHA_SPOT.z });
  return best;
}
function actionLabel(t) {
  if (!t) return '';
  if (t.kind === 'shop') return '가게 열기';
  if (t.kind === 'gacha') return '뽑기';
  if (t.kind === 'plot') {
    const pl = state.plots[t.i];
    if (!pl.crop) { const s = seedToUse(); return s ? `${CROP[s].name} 심기` : '씨앗 없음'; }
    if (pl.prog >= 1) return `${CROP[pl.crop].name} 수확`;
    return `자라는 중 ${Math.floor(pl.prog * 100)}%`;
  }
  if (t.kind === 'pad') {
    const pd = state.pads[t.i];
    if (!pd.h) { const h = helperToUse(); return h ? `${HELPER[h].name} 놓기` : '빈 자리'; }
    return `${HELPER[pd.h].name} 가방에 넣기`;
  }
  return '';
}
function seedToUse() {
  const s = selected(); if (s && s.type === 'seed') return s.id;
  for (const c of CROPS) if (state.seeds[c.id] > 0) return c.id;
  return null;
}
function helperToUse() {
  const s = selected(); if (s && s.type === 'helper') return s.id;
  for (const h of HELPERS) { const o = state.helpers[h.id]; if (o && o.pad < 0) return h.id; }
  return null;
}
function act() {
  const t = targetNear();
  if (!t) { sfx.nope(); toast('밭, 친구 자리, 가게, 뽑기 기계 가까이에서 눌러 주세요'); return; }
  if (t.kind === 'shop') { openMenu('shop'); return; }
  if (t.kind === 'gacha') { openMenu('gacha'); return; }
  if (t.kind === 'plot') {
    const pl = state.plots[t.i];
    if (!pl.crop) {
      const s = seedToUse();
      if (!s) { sfx.nope(); toast('씨앗이 없어요. 가게에서 사 오세요!'); return; }
      state.seeds[s]--; pl.crop = s; pl.prog = 0; pl.left = s === 'strawberry' ? tune.strawberry_harvests : 1;
      sfx.plant(); events.push({ type: 'plant', crop: s }); burst(t.x, 0.5, t.z, '#a8744a', 6, 1.5);
      return;
    }
    if (pl.prog >= 1) {
      let n = 1; if (rng() < doubleChance()) n = 2;
      state.crops[pl.crop] += n; state.harvests++;
      floatText(t.x, 1.5, t.z, n > 1 ? `${CROP[pl.crop].name} x2!` : `+1 ${CROP[pl.crop].name}`, n > 1 ? '#ffd23f' : '#ffffff');
      burst(t.x, 0.8, t.z, '#ffe27a', n > 1 ? 18 : 8, 2.4);
      sfx.pop(); events.push({ type: 'harvest', crop: pl.crop, n });
      pl.left--;
      if (pl.left > 0) pl.prog = 1 - tune.strawberry_regrow / tune.strawberry_grow * 1; else { pl.crop = null; pl.prog = 0; }
      if (pl.crop) pl.prog = Math.max(0.6, pl.prog);
      if (!state.hints.sell && state.harvests >= 2) { state.hints.sell = true; toast('수확한 작물은 가게에서 팔아요'); }
      return;
    }
    toast(`${CROP[pl.crop].name}: ${Math.floor(pl.prog * 100)}% 자랐어요`);
    return;
  }
  if (t.kind === 'pad') {
    const pd = state.pads[t.i];
    if (!pd.h) {
      const h = helperToUse();
      if (!h) { sfx.nope(); toast('뽑기 기계에서 친구를 뽑아 여기에 놓아요'); return; }
      pd.h = h; pd.timer = 0; state.helpers[h].pad = t.i;
      sfx.merge(); burst(t.x, 1, t.z, tierColor(HELPER[h].tier, state.t), 20, 3);
      toast(`${HELPER[h].name}: ${abilityText(h, state.helpers[h].star)}`, '#fff6c8');
      events.push({ type: 'place', helper: h }); save();
      return;
    }
    collectPad(t.i, true);
    const h = pd.h; state.helpers[h].pad = -1; pd.h = null; pd.timer = 0;
    sfx.click(); toast(`${HELPER[h].name}을(를) 가방에 넣었어요`);
    return;
  }
}
function collectPad(i, quiet) {
  const pd = state.pads[i], p = padPos(i);
  if (!pd.goods.length) return;
  for (const g of pd.goods) {
    if (g.k === 'coin') addCoins(g.v, p.x, 1.6, p.z);
    else { state.goods[g.k][0]++; state.goods[g.k][1] += g.v; floatText(p.x, 1.6, p.z, `+1 ${GOODS[g.k]}`, '#fff'); }
  }
  if (pd.goods.some(g => g.k === 'coin')) sfx.coin(); else sfx.pop();
  pd.goods = [];
  if (!state.hints.goods) { state.hints.goods = true; toast('모은 달걀·우유 같은 것도 가게에서 팔아요'); }
}

// gacha
function pull(premium) {
  const cost = premium ? tune.gacha_premium_cost : gachaCost();
  if (state.coins < cost) { sfx.nope(); toast(`코인이 ${fmt(cost - state.coins)} 모자라요`); return; }
  state.coins -= cost;
  let id;
  if (state.pulls === 0 && !premium) id = 'chicken'; // the first pull is always a chicken
  else {
    const w = []; let sum = 0;
    for (let i = 0; i < 8; i++) { const v = tune[`w${i}_${premium ? 'premium' : 'normal'}`]; w.push(v); sum += v; }
    let r = rng() * sum, tier = 0;
    for (; tier < 7; tier++) { if (r < w[tier]) break; r -= w[tier]; }
    const pool = HELPERS.filter(h => h.tier === tier);
    id = pool[Math.floor(rng() * pool.length)].id;
  }
  state.pulls++;
  const had = state.helpers[id];
  let merged = false, refund = 0;
  if (had) {
    if (had.star < tune.star_max) { had.star++; merged = true; }
    else { refund = helperPrice(id); state.coins += refund; }
  } else state.helpers[id] = { star: 1, pad: -1 };
  state.seen[id] = true;
  state.menu = null;
  state.reveal = { id, t: 0, merged, refund, star: state.helpers[id].star, premium };
  events.push({ type: 'pull', helper: id, tier: HELPER[id].tier, merged });
  sfx.roll();
  save();
}
function endReveal() {
  const r = state.reveal; state.reveal = null;
  revealHolder.clear(); beam.visible = false;
  const h = HELPER[r.id];
  if (r.merged) toast(`합체! ${h.name} ★${r.star}: ${abilityText(r.id, r.star)}`, '#fff6c8', 3.4);
  else if (r.refund) toast(`${h.name}은(는) 이미 최고 별이라 ${fmt(r.refund)}코인으로 바꿨어요`);
  else if (!state.hints.place) { state.hints.place = true; toast(`${h.name}이(가) 가방에 들어갔어요. 오른쪽 돌판에 놓아 주세요!`, '#fff6c8', 4); }
  else toast(`${h.name}이(가) 가방에 들어갔어요`);
}

// shop actions
function sellAll() {
  let total = 0, lines = [];
  for (const c of CROPS) { const n = state.crops[c.id]; if (n) { const v = n * cropPrice(c.id); total += v; lines.push(`${c.name} ${n}개 +${fmt(v)}`); state.crops[c.id] = 0; } }
  for (const k of Object.keys(state.goods)) { const [n, v] = state.goods[k]; if (n) { total += v; lines.push(`${GOODS[k]} ${n}개 +${fmt(v)}`); state.goods[k] = [0, 0]; } }
  if (!total) { sfx.nope(); toast('팔 것이 없어요'); return; }
  state.sale = { lines, total, t: 0 };
  addCoins(total); lines.forEach((_, i) => setTimeout(() => sfx.sale(i), i * 90)); sfx.coin();
  events.push({ type: 'sell', total }); save();
}
function buySeed(id, n) {
  const cost = tune[id + '_cost'] * n;
  if (state.coins < cost) { sfx.nope(); toast(`코인이 ${fmt(cost - state.coins)} 모자라요`); return; }
  state.coins -= cost; state.seeds[id] += n; sfx.coin(); save();
}
function buyRow() {
  if (state.rows >= tune.field_max_rows) return;
  const c = rowCost(); if (state.coins < c) { sfx.nope(); toast(`코인이 ${fmt(c - state.coins)} 모자라요`); return; }
  state.coins -= c; state.rows++;
  for (let i = 0; i < PLOT_COLS; i++) state.plots.push({ crop: null, prog: 0, left: 0 });
  sfx.merge(); toast('밭이 넓어졌어요!'); save();
}
function buyPad() {
  if (state.pads.length >= tune.pads_max) return;
  const c = padCost(); if (state.coins < c) { sfx.nope(); toast(`코인이 ${fmt(c - state.coins)} 모자라요`); return; }
  state.coins -= c; state.pads.push({ h: null, timer: 0, goods: [] });
  sfx.merge(); toast('친구 자리가 하나 늘었어요!'); save();
}
function sellHelper(id) {
  const h = state.helpers[id]; if (!h) return;
  const v = helperPrice(id);
  if (h.pad >= 0) { collectPad(h.pad, true); state.pads[h.pad].h = null; }
  delete state.helpers[id];
  addCoins(v); sfx.coin(); toast(`${HELPER[id].name}을(를) ${fmt(v)}코인에 팔았어요`); save();
}

function openMenu(type) { state.menu = { type, tab: 0, sel: 0, confirm: null }; sfx.click(); }

// ---- The world's update -------------------------------------------------------------------
function updateFarm(dt) {
  // crops grow on their own
  state.plots.forEach((pl, i) => {
    if (pl.crop && pl.prog < 1) {
      pl.prog = Math.min(1, pl.prog + dt * growRate(i) / tune[pl.crop + '_grow']);
      if (pl.prog >= 1) { const p = plotPos(i); burst(p.x, 0.8, p.z, '#fff7a0', 6, 1.6); events.push({ type: 'ripe', crop: pl.crop }); }
    }
  });
  // helpers make goods or coins
  state.pads.forEach((pd, i) => {
    if (!pd.h) return;
    const h = HELPER[pd.h];
    if (h.kind !== 'lay' && h.kind !== 'coin') return;
    if (pd.goods.length >= tune.goods_cap) return;

    const words = lab.split(' ');

    else text(lab, a.x, a.y, 24, '#4a3010');
  }
  // floating words
  for (const f of floats) {
    const s = toScreen(f.x, f.y + f.t * 1.4, f.z); if (s.behind) continue;
    ctx.globalAlpha = Math.max(0, 1 - f.t / 1.3);
    textOutlined(f.text, s.x, s.y, 24, f.color, 'center', '#3a2a10');
    ctx.globalAlpha = 1;
  }
  // toasts
  toasts.forEach((tt, i) => {
    const a = Math.min(1, tt.t * 6, (tt.hold - tt.t) * 3); if (a <= 0) return;
    ctx.globalAlpha = a; ctx.font = `bold 21px ${FONT}`;
    const w = Math.min(W - 40, ctx.measureText(tt.text).width + 40), y = 96 + i * 54 + (touchMode ? 60 : 0);
    panel(W / 2 - w / 2, y, w, 44, tt.color, '#8a6a3a', 16);
    text(tt.text, W / 2, y + 23, 21, '#3a2a10');
    ctx.globalAlpha = 1;
  });
  // the sale, line by line
  if (state.sale) {
    const s = state.sale, n = Math.min(s.lines.length, Math.floor(s.t / 0.12) + 1);
    const w = 360, h = 70 + n * 30, x = W / 2 - w / 2, y = H * 0.26;
    ctx.globalAlpha = Math.min(1, (2.6 + s.lines.length * 0.12 - s.t) * 2);
    panel(x, y, w, h, '#fffbe8', '#e0a030');
    s.lines.slice(0, n).forEach((l, i) => text(l, W / 2, y + 26 + i * 30, 20, '#4a3a20'));
    textOutlined(`+${fmt(s.total)} 코인`, W / 2, y + h - 24, 28, '#ffd23f', 'center', '#7a4a10');
    ctx.globalAlpha = 1;
  }
  // gacha reveal banner
  if (state.reveal && state.reveal.t > 0.9) {
    const r = state.reveal, h = HELPER[r.id], col = tierColor(h.tier, state.t);
    const y = H * 0.68, w = Math.min(W - 40, 560);
    panel(W / 2 - w / 2, y, w, 108, '#fffdf6', col === '#fff6d8' ? '#d8b040' : col, 22);
    textOutlined(TIERS[h.tier].name + '!', W / 2, y + 30, 30, col, 'center', '#3a2a40');
    text(r.merged ? `${h.name} 합체! ★${r.star}` : r.refund ? `${h.name} (최고 별)` : `${h.name} 획득!`, W / 2, y + 70, 26, '#3a3020');
    text(touchMode ? '탭해서 계속' : '스페이스로 계속', W / 2, y + 96, 15, '#8a7a64', 'center', 'normal');
  }
}

// ---- Scenes ------------------------------------------------------------------------------
let pauseSel = 0, resetConfirm = false;
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      renderer.render(figScene, figCam);
      ctx.clearRect(0, 0, W, H);
      for (const f of figLabels) { const s = toScreen(f.x, 0, f.z, figCam); textOutlined(f.label, s.x, s.y, 17, '#ffffff', 'center', '#2b4a2a'); if (f.sub) textOutlined(f.sub, s.x, s.y + 20, 14, '#fff6c8', 'center', '#2b4a2a'); }
      textOutlined('봄빛 뽑기 농장: 친구, 작물, 물건', W / 2, 30, 24, '#ffffff');
    },
  },
  title: {
    update(dt) {
      state.t += dt;
      if (pressed('Enter') || pressed('Space')) startGame();
      taps.forEach(t => t.b.act()); taps = [];
    },
    draw(dt) {
      // the farm, slowly circling
      const a = state.t * 0.12;
      camera.position.set(Math.sin(a) * 22, 13, Math.cos(a) * 22 - 1); camera.lookAt(0, 0, -2);
      animateWorld(dt);
      renderer.render(world, camera);
      ctx.clearRect(0, 0, W, H); uiButtons = [];
      const pw = Math.min(W - 40, 820), ph = 360, px = (W - pw) / 2, py = Math.max(20, H / 2 - ph / 2 - 30);
      panel(px, py, pw, ph, 'rgba(255,250,238,0.94)', '#e07aa0', 28);
      textOutlined(TITLE, W / 2, py + 64, 56, '#ffffff', 'center', '#e0507a');
      text('작물을 키워 팔고, 뽑기로 친구를 모아 합쳐 보세요', W / 2, py + 120, 21, '#6a4a3a');
      ctx.save(); ctx.beginPath(); ctx.rect(px + 10, py, pw - 20, ph); ctx.clip();
      CONTROLS.forEach((c, i) => {
        const parts = c.split(': '); text(parts[0], W / 2, py + 162 + i * 62, 18, '#a0507a');
        wrapText(parts[1], W / 2, py + 186 + i * 62, pw - 60, 16, '#5a4a3a');
      });
      ctx.restore();
      button(W / 2 - 150, py + ph - 76, 300, 62, hasSave() ? '이어하기' : '시작하기', startGame, { size: 28, color: '#ffcf3a', sel: true });
      text('Enter 또는 탭해서 시작', W / 2, py + ph + 26, 18, '#ffffff');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || (pressed('Escape') && !state.menu)) { scene = 'pause'; pauseSel = 0; resetConfirm = false; return; }
      const tapsNow = taps; taps = [];
      state.t += dt;
      if (state.reveal) {
        state.reveal.t += dt;
        if (state.reveal.t > tune.reveal_time + 1.2 || (state.reveal.t > 0.9 && (pressed('Space') || pressed('Enter') || tapsNow.length))) endReveal();
      } else if (state.menu) {
        tapsNow.forEach(t => t.b.act());
        menuKeys();
      } else {
        tapsNow.forEach(t => t.b.act());
        if (state.menu) { /* a tap opened a menu */ }
        else {
          for (let i = 0; i < 8; i++) if (pressed('Digit' + (i + 1))) { state.sel = i; sfx.click(); }
          if (pressed('Space') || pressed('Enter')) act();
          else if (pressed('KeyB')) openMenu('shop');
          else if (pressed('KeyG')) openMenu('gacha');
          else if (pressed('KeyC')) openMenu('book');
          movePlayer(dt);
        }
      }
      if (!state.menu) updateCamera(dt);
      if (state.sale) { state.sale.t += dt; if (state.sale.t > 2.6 + state.sale.lines.length * 0.12) state.sale = null; }
      updateFarm(dt);
      state.score = state.coins;
      for (const f of floats) f.t += dt; while (floats.length && floats[0].t > 1.3) floats.shift();
      for (const t of toasts) t.t += dt; while (toasts.length && toasts[0].t > toasts[0].hold) toasts.shift();
      saveTimer += dt; if (saveTimer > 5) { saveTimer = 0; save(); }
      if (pressed('KeyR') && !state.menu) { /* R does nothing in play: reset lives in the pause menu */ }
    },
    draw(dt) {
      placeCamera(dt);
      animateWorld(dt);
      renderer.render(world, camera);
      ctx.clearRect(0, 0, W, H); uiButtons = [];
      drawHUD(dt);
      drawMenu();
    },
  },
  pause: {
    update() {
      const tapsNow = taps; taps = [];
      if (pressed('KeyP') || pressed('Escape')) { scene = 'play'; return; }
      if (pressed('ArrowDown') || pressed('KeyS')) pauseSel = Math.min(2, pauseSel + 1);
      if (pressed('ArrowUp') || pressed('KeyW')) pauseSel = Math.max(0, pauseSel - 1);
      const acts = pauseActs();
      if (pressed('Space') || pressed('Enter')) acts[pauseSel]();
      tapsNow.forEach(t => t.b.act());
    },
    draw(dt) {
      placeCamera(0); renderer.render(world, camera);
      ctx.clearRect(0, 0, W, H); uiButtons = [];
      ctx.fillStyle = 'rgba(30,50,40,0.4)'; ctx.fillRect(0, 0, W, H);
      const pw = Math.min(W - 40, 460), ph = 360, px = (W - pw) / 2, py = (H - ph) / 2;
      panel(px, py, pw, ph, '#fff8ea', '#8a6a3a');
      textOutlined('잠깐 쉬는 중', W / 2, py + 44, 34, '#ffffff', 'center', '#7a5a2a');
      const acts = pauseActs(), labels = ['계속하기', muted ? '소리 켜기' : '소리 끄기', resetConfirm ? '정말 처음부터? (농장이 지워져요)' : '처음부터 다시'];
      labels.forEach((l, i) => button(px + 30, py + 94 + i * 80, pw - 60, 62, l, acts[i], { sel: pauseSel === i, size: i === 2 && resetConfirm ? 19 : 24, color: i === 2 ? (resetConfirm ? '#ff9a7a' : '#ffd6c8') : undefined }));
    },
  },
};
function pauseActs() {
  return [
    () => { scene = 'play'; sfx.click(); },
    () => setMuted(!muted),
    () => {
      if (!resetConfirm) { resetConfirm = true; sfx.click(); return; }
      try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
      reset(); scene = 'play'; resetConfirm = false; toast('새 농장을 시작했어요!');
    },
  ];
}
let saveTimer = 0;
function startGame() {
  if (!load()) reset();
  scene = 'play'; sfx.click();
  if (!state.hints.start) { state.hints.start = true; toast(touchMode ? '밭 앞에서 큰 버튼을 눌러 당근을 심어요' : '밭 앞에서 스페이스를 눌러 당근을 심어요', '#fff6c8', 4); }
}
function wrapText(s, x, y, maxW, size, color) {
  ctx.font = `normal ${size}px ${FONT}`;
  const words = s.split(' '); let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { text(line, x, yy, size, color, 'center', 'normal'); line = w; yy += size + 6; }
    else line = test;
  }
  if (line) text(line, x, yy, size, color, 'center', 'normal');
}

// the camera follows the player from behind and above
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let camInit = false;
function placeCamera(dt) {
  const p = state.player, d = tune.cam_distance + state.zoom, pitch = tune.cam_pitch;
  const tx = p.x + Math.sin(state.yaw) * d * Math.cos(pitch), ty = 1.2 + d * Math.sin(pitch), tz = p.z + Math.cos(state.yaw) * d * Math.cos(pitch);
  const k = camInit && dt > 0 ? Math.min(1, dt * 8) : 1; camInit = true;
  camPos.set(camPos.x + (tx - camPos.x) * k, camPos.y + (ty - camPos.y) * k, camPos.z + (tz - camPos.z) * k);
  camLook.set(p.x, 1.2, p.z);
  camera.position.copy(camPos); camera.lookAt(camLook);
}
function animateWorld(dt) {
  const t = state.t;
  // player
  const p = state.player, u = player.userData;
  player.position.set(p.x, 0, p.z); player.rotation.y = p.rot;
  const sw = p.moving ? Math.sin(p.walk) * 0.7 : 0;
  u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw * 0.8; u.armR.rotation.x = sw * 0.8;
  player.position.y = p.moving ? Math.abs(Math.cos(p.walk)) * 0.08 : 0;
  syncPlots(t); syncPads(t);
  // highlight
  const tg = scene === 'play' && !state.menu && !state.reveal ? targetNear() : null;
  highlight.visible = !!tg && (tg.kind === 'plot' || tg.kind === 'pad');
  if (tg) { highlight.position.set(tg.x, 0, tg.z); const s = 1 + Math.sin(t * 6) * 0.04; highlight.scale.set(s, 1, s); }
  // gacha machine idles and calls when you can afford a pull
  const canPull = state.coins >= gachaCost();
  capsules.forEach((c, i) => { c.rotation.y += 0.01 * (i % 3 + 1); });
  hintArrow.visible = canPull && state.pulls < 3 && !state.reveal;
  hintArrow.position.set(GACHA.x, 5.3 + Math.sin(t * 4) * 0.3, GACHA.z);
  if (!hintArrow.visible && Object.values(state.helpers).some(h => h.pad < 0) && state.pads.some(pd => !pd.h)) {
    const i = state.pads.findIndex(pd => !pd.h), pp = padPos(i);
    hintArrow.visible = true; hintArrow.position.set(pp.x, 2.2 + Math.sin(t * 4) * 0.3, pp.z);
  }
  hintArrow.rotation.y = t * 2;
  // gacha reveal
  const r = state.reveal;
  if (r) {
    const rt = r.t, tier = HELPER[r.id].tier, col = tierColor(tier, t);
    gachaBody.position.x = rt < 0.9 ? Math.sin(rt * 60) * 0.08 : 0;
    gachaBody.userData.crank.rotation.z = -rt * 8;
    if (rt > 0.9) {
      beam.visible = true; beam.material.color.set(col); beam.material.opacity = 0.35 + 0.15 * Math.sin(t * 10);
      beam.scale.set(0.6 + tier * 0.12, 1, 0.6 + tier * 0.12);
      if (!revealHolder.children.length) {
        const m = makeHelper(r.id); m.scale.setScalar(1.5); revealHolder.add(m);
        burst(GACHA.x, 4, GACHA.z + 0.6, col, 24 + tier * 8, 4);
        sfx.reveal(tier); if (r.merged) setTimeout(() => sfx.merge(), 700);
      }
      const k = Math.min(1, (rt - 0.9) * 3);
      revealHolder.scale.setScalar(0.2 + k * 0.8 + Math.sin(rt * 5) * 0.03);
      revealHolder.rotation.y = rt * 1.6;
      revealHolder.position.y = 4.6 + Math.sin(rt * 3) * 0.2;
      if (crng() < 0.3 + tier * 0.05) sparkle(GACHA.x + (crng() - 0.5) * 2, 4.5, GACHA.z + 0.6 + (crng() - 0.5) * 2, col, 1.5);
    }
  } else gachaBody.position.x = 0;
  // sparkles
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i]; s.t += dt; s.vy -= 6 * dt;
    s.m.position.x += s.vx * dt; s.m.position.y += s.vy * dt; s.m.position.z += s.vz * dt; s.m.rotation.x += dt * 5;
    s.m.material.opacity = Math.max(0, 1 - s.t / s.life);
    if (s.t > s.life) { world.remove(s.m); s.m.material.dispose(); sparkles.splice(i, 1); }
  }
  // petals and clouds
  const n = Math.min(PETAL_MAX, tune.petal_count), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), one = new THREE.Vector3(1, 1, 1), v = new THREE.Vector3();
  petals.count = n;
  for (let i = 0; i < n; i++) {
    const d = petalData[i];
    d.y -= d.sp * dt; if (d.y < 0) { d.y = 12; d.x = p.x + (crng() - 0.5) * 40; d.z = p.z + (crng() - 0.5) * 34; }
    v.set(d.x + Math.sin(t * 0.8 + d.s) * 1.2, d.y, d.z + Math.cos(t * 0.6 + d.s) * 0.6);
    e.set(t * 1.5 + d.s, t + d.s * 2, 0); q.setFromEuler(e); m4.compose(v, q, one); petals.setMatrixAt(i, m4);
  }
  petals.instanceMatrix.needsUpdate = true;
  clouds.forEach((c, i) => { c.position.x += dt * (0.4 + i * 0.05); if (c.position.x > 50) c.position.x = -50; });
  if (audio && crng() < dt / 9) sfx.bird();
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
let lastDt = STEP;
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  const frameDt = Math.min(now - last, 0.25);
  acc += frameDt; last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  lastDt = Math.max(frameDt, 0);
  drawFrame();
}
function drawFrame() { scenes[scene].draw(lastDt); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; lastDt = STEP; drawFrame(); }
  },
};

reset();
fit();
scene = params.get('scene') || 'title';
if (scene !== 'title' && scene !== 'figures' && !scenes[scene]) scene = 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
